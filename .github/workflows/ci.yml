name: CI Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Quality Gate (Lint, Format, Test)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Create virtual environment (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip setuptools wheel
    
    - name: Create virtual environment (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m venv .venv
        .\.venv\Scripts\Activate.ps1
        python -m pip install --upgrade pip setuptools wheel
    
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        source .venv/bin/activate
        if [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        else
          pip install ruff pytest
        fi
    
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        .\.venv\Scripts\Activate.ps1
        if (Test-Path requirements-dev.txt) {
          pip install -r requirements-dev.txt
        } else {
          pip install ruff pytest
        }
    
    - name: Run quality gate - Ruff lint (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        source .venv/bin/activate
        ruff check .
    
    - name: Run quality gate - Ruff lint (Windows)
      if: runner.os == 'Windows'
      run: |
        .\.venv\Scripts\Activate.ps1
        ruff check .
    
    - name: Run quality gate - Ruff format check (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        source .venv/bin/activate
        ruff format --check .
    
    - name: Run quality gate - Ruff format check (Windows)
      if: runner.os == 'Windows'
      run: |
        .\.venv\Scripts\Activate.ps1
        ruff format --check .
    
    - name: Run quality gate - Tests (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        source .venv/bin/activate
        pytest tests/ -v
    
    - name: Run quality gate - Tests (Windows)
      if: runner.os == 'Windows'
      run: |
        .\.venv\Scripts\Activate.ps1
        pytest tests/ -v
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          .pytest_cache/
          htmlcov/
        retention-days: 30

  quality-gate-summary:
    name: Quality Gate Summary
    needs: quality-gate
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check quality gate status
      run: |
        if [ "${{ needs.quality-gate.result }}" != "success" ]; then
          echo "❌ Quality gate failed!"
          exit 1
        else
          echo "✅ Quality gate passed!"
        fi
